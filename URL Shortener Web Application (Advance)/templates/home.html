<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container mt-5">

    <h2>URL Shortener</h2>

    <form method="POST">
        <input type="text" name="url" class="form-control"
               placeholder="Enter URL (https://example.com)" required>

        <button class="btn btn-primary mt-3 w-100">
            Shorten URL
        </button>
    </form>

    {% if short_url %}
    <div class="short-url-box">
        <input type="text" id="shortUrl" class="form-control"
               value="{{ short_url }}" readonly>

        <button class="copy-btn" onclick="copyURL()">
            Copy
        </button>
    </div>
    {% endif %}

    {% if error %}
        <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}

    <div class="footer-link">
        <a href="/history">View URL History</a>
    </div>

</div>

<script>
function copyURL() {
    const copyText = document.getElementById("shortUrl");
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    alert("Short URL copied to clipboard!");
}
</script>

</body>
</html>

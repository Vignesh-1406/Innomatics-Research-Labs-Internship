<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | URL Shortener</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">
    <div class="card">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>URL Shortener</h3>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>

        <form method="POST">
            <input type="text" name="url" class="form-control"
                   placeholder="Enter URL (https://example.com)" required>
            <button class="btn btn-primary w-100 mt-3">
                Shorten URL
            </button>
        </form>

        {% if short_url %}
        <div class="short-url-box mt-3">
            <input type="text" id="shortUrl" class="form-control"
                   value="{{ short_url }}" readonly>
            <button class="btn btn-success" onclick="copyURL()">
                Copy
            </button>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
        {% endif %}

        <!-- History -->
        <h4 class="mt-4">Your URLs</h4>
        <ul class="url-list">
            {% for url in urls %}
                <li>
                    {{ request.host_url }}{{ url.short_code }}
                </li>
            {% endfor %}
        </ul>

    </div>
</div>

<script>
function copyURL() {
    const text = document.getElementById("shortUrl");
    text.select();
    text.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(text.value);
    alert("Short URL copied to clipboard!");
}
</script>

</body>
</html>
